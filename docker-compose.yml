services:
  postgres:
    image: postgres:16-alpine
    container_name: cache-aside-postgres
    environment:
      POSTGRES_USER: permissoes
      POSTGRES_PASSWORD: permissoes
      POSTGRES_DB: permissoes
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
